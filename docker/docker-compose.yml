services:
  flask:
    build:
      context: ../site_finanzas
      dockerfile: Dockerfile
    container_name: flask_finanzas
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../site_finanzas:/app
      - /app/venv
    ports:
      - "8085:8000"
    environment:
      FLASK_DEBUG: "1"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MAX_CONTENT_UPLOAD_MB: ${MAX_CONTENT_UPLOAD_MB:-15}
      MAX_RESTORE_SQL_MB: ${MAX_RESTORE_SQL_MB:-500}
      # Backend de rate limiting — usa el Redis incluido abajo. Cámbialo a
      # memory:// en el .env si no quieres depender de Redis en local.
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      # Valores de cada rate limit — sintaxis Flask-Limiter "N per <unidad>".
      # Cambia aquí (o en .env) y reinicia el contenedor para aplicar.
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5 per minute}
      API_LOGIN_RATE_LIMIT: ${API_LOGIN_RATE_LIMIT:-5 per minute}
      MFA_VERIFY_RATE_LIMIT: ${MFA_VERIFY_RATE_LIMIT:-5 per minute}
      REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-5 per minute}
      RESEND_ACTIVATION_RATE_LIMIT: ${RESEND_ACTIVATION_RATE_LIMIT:-3 per 15 minute}
      FORGOT_PASSWORD_RATE_LIMIT: ${FORGOT_PASSWORD_RATE_LIMIT:-3 per 15 minute}
      RESET_PASSWORD_RATE_LIMIT: ${RESET_PASSWORD_RATE_LIMIT:-5 per 15 minute}
      PIN_SET_RATE_LIMIT: ${PIN_SET_RATE_LIMIT:-10 per minute}
      PIN_DELETE_RATE_LIMIT: ${PIN_DELETE_RATE_LIMIT:-10 per minute}
      PIN_LOGIN_RATE_LIMIT: ${PIN_LOGIN_RATE_LIMIT:-5 per minute}
      BACKUP_EXPORT_RATE_LIMIT: ${BACKUP_EXPORT_RATE_LIMIT:-5 per hour}
      BACKUP_RESTORE_RATE_LIMIT: ${BACKUP_RESTORE_RATE_LIMIT:-5 per hour}
      AI_TEST_CONNECTION_RATE_LIMIT: ${AI_TEST_CONNECTION_RATE_LIMIT:-10 per minute}
      TELEGRAM_WEBHOOK_RATE_LIMIT: ${TELEGRAM_WEBHOOK_RATE_LIMIT:-30 per minute}
      TELEGRAM_LINK_CODE_RATE_LIMIT: ${TELEGRAM_LINK_CODE_RATE_LIMIT:-5 per 10 minute}
      # Lockout de cuenta por fuerza bruta en login (password + MFA).
      LOGIN_MAX_FAILS: ${LOGIN_MAX_FAILS:-3}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-30}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finanzas_net

  redis:
    image: redis:8.0-alpine
    container_name: redis_finanzas
    restart: unless-stopped
    # Solo contadores de rate limiting: sin persistencia, memoria acotada y
    # expulsión LRU. No se publica puerto al host (solo red interna).
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - finanzas_net

  mysql:
    image: mysql:8.0
    container_name: mysql_finanzas_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_finanzas_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - finanzas_net

volumes:
  mysql_finanzas_data:

networks:
  finanzas_net:
