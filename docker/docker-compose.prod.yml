services:
  flask:
    image: monetra:release
    container_name: flask_monetra
    restart: unless-stopped
    ports:
      - "8085:8000"
    environment:
      FLASK_DEBUG: "0"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      MAX_CONTENT_UPLOAD_MB: ${MAX_CONTENT_UPLOAD_MB:-15}
      MAX_RESTORE_SQL_MB: ${MAX_RESTORE_SQL_MB:-500}
      # Telegram Bot (opcional — omitir o dejar vacío deshabilita la feature)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SERVER_URL: ${SERVER_URL:-}
      # Backend de rate limiting. Por defecto usa el Redis incluido abajo para
      # que el límite anti fuerza-bruta del login sea global entre workers.
      # Cámbialo a memory:// en el .env si la app corre detrás de un WAF/equipo
      # de seguridad y prefieres no levantar Redis.
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - monetra_net

  redis:
    image: redis:8.0-alpine
    container_name: redis_monetra
    restart: unless-stopped
    # Solo guarda contadores de rate limiting: sin persistencia. Se limita la
    # memoria y se expulsan las claves más viejas, de modo que una avalancha de
    # IPs distintas nunca pueda agotar la RAM del host.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    # NOTA: no se publica ningún puerto al host — Redis solo es accesible dentro
    # de la red interna del compose, nunca desde internet.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - monetra_net

  mysql:
    image: mysql:8.0
    container_name: mysql_monetra
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_monetra_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - monetra_net

volumes:
  mysql_monetra_data:

networks:
  monetra_net:
