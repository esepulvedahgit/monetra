<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if title %}{{ title }} — {% endif %}Monetra</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/monetra-icon.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="monetra-auth-body">

    <!-- Language switcher for unauthenticated pages -->
    <div style="position:fixed; top:1rem; right:1rem; z-index:1000;">
        <a href="{{ url_for('main.set_language', lang='es') }}"
           class="text-decoration-none small {% if get_locale()|string == 'es' %}fw-bold text-white{% else %}text-white-50{% endif %}">ES</a>
        <span class="text-white-50 small mx-1">|</span>
        <a href="{{ url_for('main.set_language', lang='en') }}"
           class="text-decoration-none small {% if get_locale()|string == 'en' %}fw-bold text-white{% else %}text-white-50{% endif %}">EN</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="container pt-3">
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
