<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block error_title %}Error{% endblock %} — Monetra</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/monetra-icon.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--monetra-bg);
            color: var(--monetra-text);
        }
        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            max-width: 480px;
            width: 100%;
        }
        .error-code {
            font-size: 7rem;
            font-weight: 800;
            line-height: 1;
            color: {% block error_code_color %}var(--monetra-primary){% endblock %};
        }
    </style>
</head>
<body data-theme="{{ current_user.theme if current_user.is_authenticated else 'dark' }}">
    <div class="error-card p-5 text-center shadow-lg">
        <div class="mb-3">
            <img src="{{ url_for('static', filename='img/monetra-icon.png') }}" alt="Monetra" height="48">
        </div>
        <div class="error-code mb-2">{% block error_code %}{% endblock %}</div>
        <h2 class="fw-bold mb-2">{% block error_heading %}{% endblock %}</h2>
        <p class="mb-4" style="color: var(--monetra-text-soft);">{% block error_message %}{% endblock %}</p>
        <div class="d-flex gap-2 justify-content-center">
            <a href="{{ url_for('main.dashboard') }}" class="btn {% block btn_class %}btn-primary{% endblock %} px-4">
                <i class="bi bi-house-fill me-1"></i> Ir al inicio
            </a>
            <button onclick="history.back()" class="btn btn-outline-secondary px-4">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
