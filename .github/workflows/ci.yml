name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_pass
          MYSQL_DATABASE: monetra_test
          MYSQL_USER: monetra_test
          MYSQL_PASSWORD: test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u monetra_test -ptest_pass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: site_finanzas
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: site_finanzas
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: monetra_test
          DB_USER: monetra_test
          DB_PASSWORD: test_pass
          SECRET_KEY: not-a-real-secret-key-for-ci
          JWT_SECRET_KEY: not-a-real-jwt-secret-for-ci
          FIELD_ENCRYPTION_KEY: dGVzdC1rZXktZm9yLWNpLW5vdC1yZWFsLXRlc3Q
          SESSION_COOKIE_SECURE: "false"
        run: python -m pytest tests/ -v

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Python code
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.3"
          src: site_finanzas

  trivy:
    name: Trivy security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan dependencies, configuration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          exit-code: "1"

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [test, ruff, trivy]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RUFF_RESULT: ${{ needs.ruff.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] || [ "$RUFF_RESULT" != "success" ] || [ "$TRIVY_RESULT" != "success" ]; then
            echo "CI checks failed: pytest=$TEST_RESULT, ruff=$RUFF_RESULT, trivy=$TRIVY_RESULT"
            exit 1
          fi
